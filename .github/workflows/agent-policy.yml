name: Agent policy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-policy.yml"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".ievo/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/validate_agent_policies.py"
  pull_request:
    paths:
      - ".github/workflows/agent-policy.yml"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".ievo/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "scripts/validate_agent_policies.py"

permissions:
  contents: read

jobs:
  agent-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate clean-clone agent policy
        run: python3 scripts/validate_agent_policies.py
