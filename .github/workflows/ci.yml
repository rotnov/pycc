name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned per D-014 / TESTING.md "Code coverage" -- never a bare "latest".
  CARGO_LLVM_COV_VERSION: "0.8.7"

jobs:
  # PR-1 scope: macOS only (matches the primary dev host). The 5-target
  # Tier-1 matrix (Linux x64/arm64, macOS x64/arm64, Windows MSVC) and the
  # cross-compiled build are PR-3's job -- see docs/DELIVERY_PLAN.md.
  build-test-coverage:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show pinned toolchain
        run: rustup show

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace
        run: |
          rustup component add clippy
          cargo clippy --workspace -- -D warnings

      - name: Install cargo-llvm-cov (pinned)
        run: cargo install cargo-llvm-cov --locked --version "${CARGO_LLVM_COV_VERSION}"

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Coverage gate smoke check
        run: cargo llvm-cov --version

      - name: cargo llvm-cov --workspace (D-014 gate, 100% lines + regions)
        run: cargo llvm-cov --workspace --fail-under-lines 100 --fail-under-regions 100
