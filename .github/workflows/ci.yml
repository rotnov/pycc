name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned per D-014 / TESTING.md "Code coverage" -- never a bare "latest".
  CARGO_LLVM_COV_VERSION: "0.8.7"

jobs:
  # PR-1/PR-2 scope: macOS only (matches the primary dev host). The
  # 5-target Tier-1 matrix (Linux x64/arm64, macOS x64/arm64, Windows MSVC)
  # and the cross-compiled build are PR-3's job -- see docs/DELIVERY_PLAN.md.
  build-test-coverage:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show

      # LLVM 22.1/inkwell 0.9 pin (D-015). Homebrew on GitHub's macOS
      # runners doesn't ship this by default, so it's installed and pinned
      # via the env var explicitly, same as the local dev setup in
      # docs/DELIVERY_PLAN.md's Environment baseline table.
      - name: Install LLVM 22 (D-015)
        run: brew install llvm@22

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      # Hard merge invariant from D-014. These thresholds must never be
      # lowered or bypassed to make a pull request pass.
      - name: Hard coverage gate — 100% lines + regions (D-014)
        run: |
          set -euo pipefail
          LLVM_SYS_221_PREFIX_VALUE="$(brew --prefix llvm@22)"
          export LLVM_SYS_221_PREFIX="$LLVM_SYS_221_PREFIX_VALUE"
          /Users/runner/.cargo/bin/cargo build --workspace
          cd "$RUNNER_TEMP"
          /Users/runner/.cargo/bin/cargo install cargo-llvm-cov --locked --version "${CARGO_LLVM_COV_VERSION}"
          cd "$GITHUB_WORKSPACE"
          /Users/runner/.cargo/bin/cargo-llvm-cov llvm-cov --version
          /Users/runner/.cargo/bin/cargo-llvm-cov llvm-cov --workspace --fail-under-lines 100 --fail-under-regions 100

      - name: Check workflow permission policy
        run: |
          ruby scripts/test_check_ci_permissions.rb
          ruby scripts/check_ci_permissions.rb

      - name: Check roadmap evidence
        run: |
          ruby scripts/test_check_roadmap_evidence.rb
          ruby scripts/check_roadmap_evidence.rb

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings
