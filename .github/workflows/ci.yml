name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned per D-014 / TESTING.md "Code coverage" -- never a bare "latest".
  CARGO_LLVM_COV_VERSION: "0.8.7"
  # D-015 pin, installed identically (same exact version) on every OS below.
  LLVM_VERSION: "22.1.1"

jobs:
  # Coverage gate lives on exactly one target, per D-014 ("at least one
  # Tier-1 target"). This job also builds/tests/lints -- it's the primary
  # dev host's own architecture (macOS arm64), unchanged from PR-1/PR-2.
  build-test-coverage:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show pinned toolchain
        run: rustup show

      - name: Install LLVM 22 (D-015)
        run: brew install llvm@22

      - name: Export LLVM_SYS_221_PREFIX
        run: echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      # tests/slice0.rs's cross-compilation test skips cleanly when this
      # target's pycc_rt build is absent (see its own environment guard), but
      # a skip means the 100% coverage gate below never sees that test's
      # success path -- so this job needs the same cross-target build that
      # cross-compile-build sets up, purely to keep coverage deterministic.
      - name: Add x86_64-apple-darwin Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Build pycc_rt for x86_64-apple-darwin
        run: cargo build --target x86_64-apple-darwin -p pycc_rt

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-llvm-cov (pinned)
        run: cargo install cargo-llvm-cov --locked --version "${CARGO_LLVM_COV_VERSION}"

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Coverage gate smoke check
        run: cargo llvm-cov --version

      - name: cargo llvm-cov --workspace (D-014 gate, 100% lines + regions)
        run: cargo llvm-cov --workspace --fail-under-lines 100 --fail-under-regions 100

  # PR-3: native build+test+lint on the other 4 Tier-1 targets. No coverage
  # requirement here -- that's build-test-coverage's job alone, per D-014.
  native-build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Show pinned toolchain
        run: rustup show

      # rustc/link.exe already discover the MSVC toolset on their own, but
      # pycc's own linking step (src/main.rs's linker_command(), D-021) shells
      # out to clang.exe directly -- outside any Developer Command Prompt,
      # its bundled lld-link.exe can't find libcmt.lib/oldnames.lib (D-024).
      # This sets up the same environment vcvarsall.bat would.
      - name: Set up MSVC Developer Command Prompt (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM 22 (Linux, via apt.llvm.org)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          # llvm.sh's own packages don't pull in Polly's static lib; llvm-sys
          # links it explicitly, so it must be installed separately here.
          sudo apt-get install -y libpolly-22-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Install LLVM 22 (macOS, via Homebrew)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      # Downloaded directly from LLVM's own GitHub release (not a third-party
      # mirror or package manager) -- no Windows package manager reliably
      # carries LLVM 22 yet, checked before choosing this.
      - name: Install LLVM 22 (Windows, official prebuilt release)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L --fail -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc.tar.xz"
          # $RUNNER_TEMP is a native Windows path (e.g. D:\a\_temp); passing
          # it straight into bash's tar/mkdir mangles the backslashes. Use a
          # plain repo-relative dir for the bash-side extraction, then
          # cygpath -w it into a real Windows path only for the env var,
          # since that's what the (native) build.rs consuming it expects.
          mkdir -p llvm-extract
          tar -xf llvm.tar.xz -C llvm-extract --strip-components=1
          echo "LLVM_SYS_221_PREFIX=$(cygpath -w "$(pwd)/llvm-extract")" >> "$GITHUB_ENV"

      # This LLVM release's own llvm-config reports libxml2 as a system lib
      # (see D-020), so llvm-sys requires a real xml2s.lib to link -- vcpkg
      # is preinstalled on GitHub's Windows runners (path varies by image,
      # hence the env var rather than a hardcoded one). static-md matches
      # Rust's own default dynamic-CRT linkage on this target.
      - name: Install libxml2 (Windows, via vcpkg, for llvm-sys's system-libs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libxml2:x64-windows-static-md
          $libDir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md\lib"
          $xml2Lib = Get-ChildItem -Path $libDir -Filter "*xml2*.lib" | Select-Object -First 1
          if (-not $xml2Lib) {
            Write-Error "no libxml2 .lib found under $libDir"
            exit 1
          }
          Copy-Item $xml2Lib.FullName "$libDir\xml2s.lib" -Force
          echo "LIB=$libDir;$env:LIB" >> $env:GITHUB_ENV

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace
        if: runner.os != 'Windows'
        run: cargo test --workspace

      # --test-threads=1: tests/slice0.rs spawns pycc.exe as a child process
      # per test; parallel runs interleave their stderr output at the OS
      # pipe level (Rust's own per-test output capture doesn't isolate
      # inherited child-process output the same way), which made an earlier
      # Windows-crash investigation (D-023) hard to attribute to specific
      # tests from the CI log alone. Serialized here so that if this ever
      # needs repeating, the log is unambiguous; not needed on other OSes.
      - name: cargo test --workspace (single-threaded, see D-023)
        if: runner.os == 'Windows'
        run: cargo test --workspace -- --test-threads=1

      # No explicit `shell:` here (unlike this step used to have) -- on
      # Windows that forced Git Bash, whose own `PATH` startup rewriting
      # puts its bundled coreutils `link.exe` (the Unix hardlink tool, at
      # `C:\Program Files\Git\usr\bin\link.exe`) ahead of MSVC's real
      # linker, breaking any proc-macro dependency's build with a bizarre
      # "extra operand" error from what is very much not a linker (D-026).
      # `cargo build`/`cargo test` above already run correctly on Windows
      # using each OS's own default shell (pwsh here) with no override;
      # this step's two commands have no bash-specific syntax, so dropping
      # the override fixes Windows and changes nothing on Linux/macOS
      # (already bash by default there).
      - name: cargo clippy --workspace
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets -- -D warnings

  # PR-3's cross-compilation proof (D-019): pycc, running natively on the
  # arm64 runner, cross-compiles for x86_64-apple-darwin using its own
  # --target flag -- same-OS/cross-arch, not cross-OS (see D-019 for why).
  cross-compile-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"

      - name: Add x86_64-apple-darwin Rust target
        run: rustup target add x86_64-apple-darwin

      - name: Build pycc_rt for x86_64-apple-darwin
        run: cargo build --target x86_64-apple-darwin -p pycc_rt

      - name: Build pycc (native)
        run: cargo build -p pycc

      - name: Cross-compile the slice-0 fixture
        run: |
          mkdir -p /tmp/cross_fixture
          printf 'print(42)\n' > /tmp/cross_fixture/hello.py
          ./target/debug/pycc build /tmp/cross_fixture/hello.py -o /tmp/cross_fixture/hello --target x86_64-apple-darwin
          file /tmp/cross_fixture/hello

      - name: Upload the cross-compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: cross-compiled-x86_64-apple-darwin
          path: /tmp/cross_fixture/hello

  # Verifies the cross-compiled binary on its own native hardware -- "built
  # on one host, executed and verified on its native runner" per
  # docs/DELIVERY_PLAN.md's PR-3 row, not just "codegen didn't error."
  cross-compile-verify:
    needs: cross-compile-build
    runs-on: macos-15-intel
    steps:
      - name: Download the cross-compiled binary
        uses: actions/download-artifact@v4
        with:
          name: cross-compiled-x86_64-apple-darwin
          path: /tmp/cross_fixture

      - name: Verify it runs natively and prints the right output
        run: |
          chmod +x /tmp/cross_fixture/hello
          file /tmp/cross_fixture/hello
          output="$(/tmp/cross_fixture/hello)"
          if [ "$output" != "42" ]; then
            echo "expected '42', got '${output}'"
            exit 1
          fi
          echo "cross-compiled binary verified on its native x86_64 runner"
