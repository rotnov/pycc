name: Main history audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  main-history-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require every pushed main commit to belong to a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_REPOSITORY: ${{ github.repository }}
          AUDIT_BEFORE: ${{ github.event.before }}
          AUDIT_AFTER: ${{ github.sha }}
        run: python3 scripts/check_main_history.py
