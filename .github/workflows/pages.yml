      - "scripts/test_check_package_identity.rb"
      - "scripts/check_indexnow_test_binding.rb"
      - "scripts/test_check_indexnow_test_binding.rb"
      - "scripts/check_markdown_landing.rb"
      - "scripts/test_check_markdown_landing.rb"
      - "scripts/check_sitemap_lastmod.rb"
      - "scripts/test_check_sitemap_lastmod.rb"
      - "scripts/site_canonical_pages.rb"
      - "scripts/check_site_pin_merge_currency.rb"
      - "scripts/test_check_site_pin_merge_currency.rb"
      - "scripts/check_source_links_registry.rb"
      - "scripts/test_check_source_links_registry.rb"
      - "site/python-aot-compilers/source-link-registry.json"
      - "site/python-aot-compilers/claims.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Validate website
        run: |
          ./scripts/check-site.sh
          ./scripts/test-check-site.sh
          python3 ./scripts/test-notify-indexnow.py
          ruby scripts/check_pages_workflow.rb
          ruby scripts/test_check_pages_workflow.rb
          ruby scripts/check_citation_cff.rb
          ruby scripts/test_check_citation_cff.rb
          ruby scripts/check_readme_claims.rb
          ruby scripts/test_check_readme_claims.rb
          ruby scripts/check_readme_testing_claims.rb
          ruby scripts/test_check_readme_testing_claims.rb
          ruby scripts/check_readme_milestone_projection.rb
          ruby scripts/test_check_readme_milestone_projection.rb
          ruby scripts/check_readme_coverage_badge.rb
          ruby scripts/test_check_readme_coverage_badge.rb
          ruby scripts/check_sitemap_lastmod.rb
          ruby scripts/test_check_sitemap_lastmod.rb
          ruby scripts/test_check_site_pin_merge_currency.rb
          ruby scripts/check_source_links_registry.rb
          ruby scripts/test_check_source_links_registry.rb
          ruby scripts/check_search_visibility.rb
          ruby scripts/test_check_search_visibility.rb
          python3 scripts/check_search_console_observations.py
          python3 scripts/test_check_search_console_observations.py
          python3 scripts/check_github_traffic_observations.py
          python3 scripts/test_check_github_traffic_observations.py
          python3 scripts/check_engine_visibility_observations.py
          python3 scripts/test_check_engine_visibility_observations.py
          python3 scripts/check_earned_authority_evidence.py
          python3 scripts/test_check_earned_authority_evidence.py
          python3 scripts/check_pages_visit_observations.py
          python3 scripts/test_check_pages_visit_observations.py
          ruby scripts/check_package_identity.rb
          ruby scripts/test_check_package_identity.rb
          ruby scripts/check_indexnow_test_binding.rb
          ruby scripts/test_check_indexnow_test_binding.rb
          ruby scripts/check_markdown_landing.rb
          ruby scripts/test_check_markdown_landing.rb

      - name: Check canonical page pins against the predicted merge date (issue #990)
        # Defense in depth for the same check that .github/workflows/ci.yml's
        # `governance` job runs; that job is the load-bearing one, since
        # `ci-gate` (a required context) fails when it fails, while `Pages` is
        # not a required context.
        #
        # Pull-request leg only, deliberately: on the push leg the merge has
        # already happened, so there is no date left to predict and the
        # committed state is validated by scripts/check_sitemap_lastmod.rb in
        # the Validate website step above.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "Not a pull_request event (or no usable base revision); skipping."
            exit 0
          fi
          ruby scripts/check_site_pin_merge_currency.rb "${BASE_SHA}" "${HEAD_SHA}" .

      - name: Check the status snapshot's currency against the pull request (issue #1006)
        # Pull-request leg only: the status hero pins one default-branch
        # commit, and this step bounds how far behind the pull request's base
        # that commit may fall (first-parent distance) so a stale snapshot is
        # refreshed before it is published rather than after. The push leg
        # validates the committed record itself through the Validate website
        # step above (scripts/check_status_snapshot.py --verify-git via
        # scripts/check-site.sh). Full history is required (fetch-depth: 0).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "Not a pull_request event (or no usable base revision); skipping."
            exit 0
          fi
          python3 scripts/check_status_snapshot.py --currency --base "${BASE_SHA}" --head "${HEAD_SHA}" \
            --max-first-parent-distance 20 site/evidence-heroes.json . .

      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  notify-indexnow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Notify IndexNow
        id: notify-indexnow
        continue-on-error: true
        env:
          GITHUB_STEP_SUMMARY: ${{ github.workspace }}/indexnow-summary.md
        run: ./scripts/notify-indexnow.sh

      - name: Report IndexNow outcome
        if: always()
        run: |
          echo "IndexNow notification outcome: ${{ steps.notify-indexnow.outcome }}"
          if [ -f indexnow-summary.md ]; then
            cat indexnow-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.notify-indexnow.outcome }}" != "success" ]; then
            echo "::warning::IndexNow notification failed (outcome=${{ steps.notify-indexnow.outcome }}). Pages deployment is unaffected."
          fi
