name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check-site.sh"
      - "scripts/test-check-site.sh"
      - "scripts/notify-indexnow.sh"
      - "scripts/test-notify-indexnow.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/check-site.sh"
      - "scripts/test-check-site.sh"
      - "scripts/notify-indexnow.sh"
      - "scripts/test-notify-indexnow.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate website
        run: |
          ./scripts/check-site.sh
          ./scripts/test-check-site.sh
          python3 ./scripts/test-notify-indexnow.py
          ruby scripts/check_pages_workflow.rb
          ruby scripts/test_check_pages_workflow.rb
          ruby scripts/check_citation_cff.rb
          ruby scripts/test_check_citation_cff.rb
          ruby scripts/check_readme_claims.rb
          ruby scripts/test_check_readme_claims.rb
          ruby scripts/check_readme_coverage_badge.rb
          ruby scripts/test_check_readme_coverage_badge.rb
          ruby scripts/check_sitemap_lastmod.rb
          ruby scripts/test_check_sitemap_lastmod.rb
          ruby scripts/check_source_links_registry.rb
          ruby scripts/test_check_source_links_registry.rb
          ruby scripts/check_search_visibility.rb
          ruby scripts/test_check_search_visibility.rb

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Notify IndexNow
        id: notify-indexnow
        continue-on-error: true
        env:
          GITHUB_STEP_SUMMARY: ${{ github.workspace }}/indexnow-summary.md
        run: ./scripts/notify-indexnow.sh

      - name: Report IndexNow outcome
        if: always()
        run: |
          echo "IndexNow notification outcome: ${{ steps.notify-indexnow.outcome }}"
          if [ -f indexnow-summary.md ]; then
            cat indexnow-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.notify-indexnow.outcome }}" != "success" ]; then
            echo "::warning::IndexNow notification failed (outcome=${{ steps.notify-indexnow.outcome }}). Pages deployment is unaffected."
          fi
