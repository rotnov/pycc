name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/ROADMAP.md"
      - "README.md"
      - "CITATION.cff"
      - "docs/WEBSITE.md"
      - "docs/SEARCH_VISIBILITY.md"
      - "docs/*_OBSERVATIONS.json"
      - "docs/EARNED_AUTHORITY_EVIDENCE.json"
      - "scripts/build_site.py"
      - "scripts/check_site.py"
      - "scripts/test_check_site.py"
      - "scripts/notify-indexnow.sh"
      - "scripts/test-notify-indexnow.py"
      - "scripts/check_pages_workflow.rb"
      - "scripts/test_check_pages_workflow.rb"
      - "scripts/check_citation_cff.rb"
      - "scripts/test_check_citation_cff.rb"
      - "scripts/check_readme_*.rb"
      - "scripts/test_check_readme_*.rb"
      - "scripts/check_search_visibility.rb"
      - "scripts/test_check_search_visibility.rb"
      - "scripts/check_*_observations.py"
      - "scripts/test_check_*_observations.py"
      - "scripts/check_earned_authority_evidence.py"
      - "scripts/test_check_earned_authority_evidence.py"
      - "scripts/check_package_identity.rb"
      - "scripts/test_check_package_identity.rb"
      - "scripts/check_indexnow_test_binding.rb"
      - "scripts/test_check_indexnow_test_binding.rb"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/ROADMAP.md"
      - "README.md"
      - "CITATION.cff"
      - "docs/WEBSITE.md"
      - "docs/SEARCH_VISIBILITY.md"
      - "docs/*_OBSERVATIONS.json"
      - "docs/EARNED_AUTHORITY_EVIDENCE.json"
      - "scripts/build_site.py"
      - "scripts/check_site.py"
      - "scripts/test_check_site.py"
      - "scripts/notify-indexnow.sh"
      - "scripts/test-notify-indexnow.py"
      - "scripts/check_pages_workflow.rb"
      - "scripts/test_check_pages_workflow.rb"
      - "scripts/check_citation_cff.rb"
      - "scripts/test_check_citation_cff.rb"
      - "scripts/check_readme_*.rb"
      - "scripts/test_check_readme_*.rb"
      - "scripts/check_search_visibility.rb"
      - "scripts/test_check_search_visibility.rb"
      - "scripts/check_*_observations.py"
      - "scripts/test_check_*_observations.py"
      - "scripts/check_earned_authority_evidence.py"
      - "scripts/test_check_earned_authority_evidence.py"
      - "scripts/check_package_identity.rb"
      - "scripts/test_check_package_identity.rb"
      - "scripts/check_indexnow_test_binding.rb"
      - "scripts/test_check_indexnow_test_binding.rb"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build website
        run: python3 scripts/build_site.py --out _site

      - name: Validate website
        run: |
          python3 scripts/check_site.py _site
          python3 scripts/test_check_site.py
          python3 ./scripts/test-notify-indexnow.py
          ruby scripts/check_pages_workflow.rb
          ruby scripts/test_check_pages_workflow.rb
          ruby scripts/check_citation_cff.rb
          ruby scripts/test_check_citation_cff.rb
          ruby scripts/check_readme_claims.rb
          ruby scripts/test_check_readme_claims.rb
          ruby scripts/check_readme_testing_claims.rb
          ruby scripts/test_check_readme_testing_claims.rb
          ruby scripts/check_readme_milestone_projection.rb
          ruby scripts/test_check_readme_milestone_projection.rb
          ruby scripts/check_readme_coverage_badge.rb
          ruby scripts/test_check_readme_coverage_badge.rb
          ruby scripts/check_search_visibility.rb
          ruby scripts/test_check_search_visibility.rb
          python3 scripts/check_search_console_observations.py
          python3 scripts/test_check_search_console_observations.py
          python3 scripts/check_github_traffic_observations.py
          python3 scripts/test_check_github_traffic_observations.py
          python3 scripts/check_engine_visibility_observations.py
          python3 scripts/test_check_engine_visibility_observations.py
          python3 scripts/check_earned_authority_evidence.py
          python3 scripts/test_check_earned_authority_evidence.py
          python3 scripts/check_pages_visit_observations.py
          python3 scripts/test_check_pages_visit_observations.py
          ruby scripts/check_package_identity.rb
          ruby scripts/test_check_package_identity.rb
          ruby scripts/check_indexnow_test_binding.rb
          ruby scripts/test_check_indexnow_test_binding.rb

      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  notify-indexnow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Notify IndexNow
        id: notify-indexnow
        continue-on-error: true
        env:
          GITHUB_STEP_SUMMARY: ${{ github.workspace }}/indexnow-summary.md
        run: ./scripts/notify-indexnow.sh

      - name: Report IndexNow outcome
        if: always()
        run: |
          echo "IndexNow notification outcome: ${{ steps.notify-indexnow.outcome }}"
          if [ -f indexnow-summary.md ]; then
            cat indexnow-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.notify-indexnow.outcome }}" != "success" ]; then
            echo "::warning::IndexNow notification failed (outcome=${{ steps.notify-indexnow.outcome }}). Pages deployment is unaffected."
          fi
